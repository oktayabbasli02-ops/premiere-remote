# XcodeGen spec — generates PremiereRemote.xcodeproj on a Mac:
#   brew install xcodegen && cd ios && xcodegen generate
name: PremiereRemote
options:
  bundleIdPrefix: com.premiereremote
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: "156.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set your Apple team ID to run on a device
    CODE_SIGN_STYLE: Automatic

targets:
  PremiereRemote:
    type: application
    platform: iOS
    sources: [PremiereRemote]
    dependencies:
      - package: WebRTC
    info:
      path: PremiereRemote/Info.plist
      properties:
        CFBundleDisplayName: PR Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: false
        # TLS only; local networking allowed solely for development against a LAN/loopback server
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connects to a development signaling server on your local network.
        # QR from the Premiere panel is an https link to the web app; this scheme lets the
        # web page hand the code over to the native app ("Open in app")
        CFBundleURLTypes:
          - CFBundleURLName: com.premiereremote.pair
            CFBundleURLSchemes: [premiereremote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.premiereremote.app
        TARGETED_DEVICE_FAMILY: "1,2"

  PremiereRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PremiereRemoteTests]
    dependencies:
      - target: PremiereRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PremiereRemote:
    build:
      targets:
        PremiereRemote: all
        PremiereRemoteTests: [test]
    test:
      targets: [PremiereRemoteTests]
